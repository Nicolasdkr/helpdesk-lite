server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # La API se sirve desde el mismo origen: el navegador no necesita CORS.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Los archivos con hash en el nombre no cambian nunca: caché de 1 año.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier otra ruta (/tickets/123, /login...) devuelve index.html
  # y React Router se encarga de pintarla.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
