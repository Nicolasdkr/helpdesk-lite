# Helpdesk Lite — entorno completo con Docker
#
#   Todo en Docker:          docker compose up --build   → app en http://localhost:8080
#   Solo la base de datos:   docker compose up -d db     (y API + frontend con `npm run dev`)

services:
  db:
    image: postgres:17-alpine
    container_name: helpdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Crea la BD de tests la primera vez que se inicializa el volumen
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: helpdesk-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://helpdesk:helpdesk@db:5432/helpdesk?schema=public
      CORS_ORIGIN: http://localhost:5173
      # Valor de demo. En un despliegue real, pásalo como secreto (nunca en el repo).
      JWT_SECRET: ${JWT_SECRET:-docker-demo-secret-cambiar-en-produccion-123456}
      JWT_EXPIRES_IN: 1d
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: helpdesk-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
